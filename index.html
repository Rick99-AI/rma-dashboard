<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2330;--sub:#5d6778;--line:#d5dbe4;--acc:#1f5fbf;--err:#c00000}
@media (prefers-color-scheme:dark){:root{--bg:#0e131a;--card:#161d27;--ink:#e5e9f0;--sub:#9aa3b2;--line:#2b3544;--acc:#5b9bff;--err:#ff7070}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
.meta{margin:0 0 20px;color:var(--sub);font-size:13px}
input[type=email],input[type=password]{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
input[type=email]:focus,input[type=password]:focus{outline:2px solid var(--acc);outline-offset:1px}
.rm{display:flex;gap:8px;align-items:center;margin:12px 0 18px;font-size:13px;color:var(--sub);cursor:pointer}
button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{min-height:20px;margin-top:10px;font-size:13px;color:var(--err)}
.wait{color:var(--sub);font-size:13px}
.help{width:100%;max-width:380px;margin:0;font-size:13px;line-height:1.7;color:var(--sub)}
.help a{color:var(--acc);text-decoration:none;border-bottom:1px solid currentColor}
.help b{color:var(--ink)}
</style>
</head>
