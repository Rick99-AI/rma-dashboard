<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>退件库存分级看板</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1c2330;--sub:#5d6778;--line:#d5dbe4;--acc:#1f5fbf;--err:#c00000}
@media (prefers-color-scheme:dark){:root{--bg:#0e131a;--card:#161d27;--ink:#e5e9f0;--sub:#9aa3b2;--line:#2b3544;--acc:#5b9bff;--err:#ff7070}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
h1{font-size:18px;margin:0 0 4px;font-weight:600}
.meta{margin:0 0 20px;color:var(--sub);font-size:13px}
input[type=password]{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--acc);outline-offset:1px}
.rm{display:flex;gap:8px;align-items:center;margin:12px 0 18px;font-size:13px;color:var(--sub);cursor:pointer}
button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.err{min-height:20px;margin-top:10px;font-size:13px;color:var(--err)}
.wait{color:var(--sub);font-size:13px}
</style>
</head>

  function bytes(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function store(op, v) {
    try {
      if (op === "get") return localStorage.getItem(STORE);
      if (op === "set") localStorage.setItem(STORE, v); else localStorage.removeItem(STORE);
    } catch (e) {}
    return null;
  }
  if (!(window.crypto && crypto.subtle && window.DecompressionStream && window.TextEncoder)) {
    show(); go.disabled = true;
    err.textContent = "当前浏览器版本过旧，请用最新版 Chrome、Edge 或 Safari 打开。";
    return;
  }
  var blob = bytes(DATA), iv = blob.slice(0, 12), ct = blob.slice(12);
  function decrypt(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct).then(function (plain) {
      return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    });
  }
  function render(html) { document.open(); document.write(html); document.close(); }
  if (location.hash === "#lock") { store("del"); history.replaceState(null, "", location.pathname + location.search); }
  var saved = store("get");
  if (saved) {
    crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", false, ["decrypt"])
      .then(decrypt).then(render)
      .catch(function () { store("del"); show(); });
  } else {
    show();
  }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "正在验证…";
    var enc = new TextEncoder(), key;
    crypto.subtle.importKey("raw", enc.encode(pw.value.normalize("NFC")), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: "PBKDF2", salt: enc.encode(SALT), iterations: ITER, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      })
      .then(function (k) { key = k; return decrypt(k); })
      .then(function (html) {
        if (!rm.checked) return render(html);
        return crypto.subtle.exportKey("raw", key).then(function (raw) { store("set", b64(raw)); render(html); });
      })
      .catch(function () {
        go.disabled = false; go.textContent = "进入看板";
        err.textContent = "密码不正确，请重试。"; pw.select();
      });
  });
})();
</script>
</body>
